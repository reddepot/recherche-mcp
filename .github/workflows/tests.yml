# Audit externe 2026-05-09 ChatGPT P2 : pas de CI = 68/68 tests verts
# non vérifiés indépendamment. Workflow minimal pour validation continue.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"

      - name: Setup Python 3.13
        run: uv python install 3.13

      - name: Create venv + install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run unit tests (fast, no embeddings)
        run: |
          source .venv/bin/activate
          pytest -m unit --tb=short -q

      - name: Lint with ruff
        run: |
          source .venv/bin/activate
          ruff check src tests

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Tests integ chargent sentence-transformers (~200MB) — séparés de unit
    # pour pipeline rapide en CI quotidien.
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python 3.13
        run: uv python install 3.13

      - name: Create venv + install
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run integration tests (with embeddings)
        run: |
          source .venv/bin/activate
          pytest -m integ --tb=short -q
