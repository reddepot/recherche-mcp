[project]
name = "recherche-mcp"
version = "0.1.0"
description = "MCP server for orthogonal question decomposition + dispatch matrix (Phase A — Voie 3 minimal)"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Radu", email = "redtech@protonmail.com"}]
license = {text = "Proprietary"}
keywords = ["mcp", "research", "decomposition", "multi-llm", "medecine-du-travail"]

dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
    "sentence-transformers>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
recherche-mcp = "recherche_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recherche_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
    "integ: integration tests (slower, may load embeddings model)",
    "unit: unit tests (fast)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
