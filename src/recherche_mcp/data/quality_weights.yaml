# Pondération des 6 critères qualité par domaine (cf ADR-0002).
#
# Une moyenne simple équipondérée masquerait les priorités métier réelles.
# Exemple : pour le juridique, la `couverture` (exhaustivité des articles
# applicables) compte davantage que la `comparaison_int` (jurisprudence
# étrangère). Pour le technique, la `clarte` (code lisible et runnable)
# l'emporte sur `tracabilite`.
#
# Format : domain → {critere: poids}. Somme des poids = 1.0 par domaine.
# Évolution future possible via DEVCODE-Vote ou DSPy (cf DSPY_GATE).

clinique:
  couverture: 0.20
  orthogonalite: 0.15
  autonomie: 0.10
  clarte: 0.10
  balance: 0.10
  tracabilite: 0.35  # crucial médico-légal (Loi Kouchner, Art. L4624-8 CT)

juridique_fr:
  couverture: 0.25  # exhaustivité des articles applicables
  orthogonalite: 0.10
  autonomie: 0.10
  clarte: 0.10
  balance: 0.10
  tracabilite: 0.35  # n° d'arrêt + doctrine = audit-able

technique:
  couverture: 0.15
  orthogonalite: 0.20
  autonomie: 0.15
  clarte: 0.20  # importance code runnable, lisibilité
  balance: 0.15
  tracabilite: 0.15

multilingue:
  couverture: 0.20
  orthogonalite: 0.20
  autonomie: 0.15
  clarte: 0.15
  balance: 0.15
  tracabilite: 0.15

mixte:
  # Pondération neutre = moyenne simple (pas de prior métier identifiable)
  couverture: 0.166667
  orthogonalite: 0.166667
  autonomie: 0.166667
  clarte: 0.166667
  balance: 0.166667
  tracabilite: 0.166665  # ajustement floating point pour somme = 1.0
